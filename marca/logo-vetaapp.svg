<!--
  El logo de VetaApp, mismo dibujo que VetaAppLogo en icons.jsx.

  Existe como archivo porque el componente de React solo sirve dentro de la
  app: Gmail, WhatsApp Business o una tarjeta impresa piden una imagen. Los
  colores están escritos en hex y no como variable CSS, porque fuera del
  navegador no hay hoja de estilos que las resuelva.

  Ojo si se edita este comentario: XML prohíbe dos guiones seguidos adentro
  de un comentario. Escribir el nombre de la variable CSS tal cual rompe el
  archivo entero y el render sale en blanco.

  Si se cambia el logo en icons.jsx hay que cambiarlo aquí también. Son dos
  copias del mismo dibujo y no hay forma de evitarlo sin build extra.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 40 40" fill="none">
  <ellipse cx="10" cy="10" rx="3" ry="4" fill="#1B4332"/>
  <ellipse cx="17" cy="6.5" rx="2.8" ry="4" fill="#1B4332"/>
  <ellipse cx="24" cy="6.5" rx="2.8" ry="4" fill="#1B4332"/>
  <ellipse cx="30" cy="10" rx="3" ry="4" fill="#1B4332"/>
  <path d="M11 22 Q 9 15, 20 15 Q 31 15, 29 22 Q 28 30, 20 32 Q 12 30, 11 22 Z" fill="#1B4332"/>
  <path d="M13 23 L 16 23 L 17.5 19 L 19 26 L 21 21 L 22.5 24 L 27 24"
        stroke="#52B788" stroke-width="1.4" stroke-linecap="round"
        stroke-linejoin="round" fill="none" opacity="0.95"/>
</svg>
